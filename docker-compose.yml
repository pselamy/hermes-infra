services:
  reeve-agent:
    image: nousresearch/hermes-agent:latest
    container_name: reeve-agent
    command: ["gateway", "run"]
    restart: unless-stopped
    volumes:
      - /opt/hermes-data:/opt/data
      - ./config:/etc/hermes:ro
    env_file:
      - .env
    environment:
      - HERMES_CONFIG_PATH=/etc/hermes/hermes.yaml
      # Per-request LLM timeout: prevents hung OpenRouter calls (incident 2026-05-22).
      # Default HERMES_API_TIMEOUT is 1800s (30min) which allowed a 7691s hang.
      - HERMES_API_TIMEOUT=180
      - HERMES_STREAM_READ_TIMEOUT=120
      - HERMES_STREAM_STALE_TIMEOUT=120
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 3g
    memswap_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
